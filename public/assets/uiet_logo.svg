<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="sunburstGrad" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#e0f2fe" />
      <stop offset="70%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </radialGradient>

    <!-- Golden Hand Gradient -->
    <linearGradient id="goldHandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#fde047" />
      <stop offset="55%" stop-color="#eab308" />
      <stop offset="85%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>

    <!-- Ribbon Blue Gradient -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>

    <!-- Paths for Curved Text -->
    <path id="upperTextArc" d="M 75,250 A 175,175 0 1,1 425,250" fill="none" />
    <path id="sanskritArc" d="M 120,402 Q 250,370 380,402" fill="none" />
    <path id="punjabUniArc" d="M 110,432 Q 250,470 390,432" fill="none" />
  </defs>

  <!-- Outer Gear Cogs Ring -->
  <g id="gearCogs" fill="#0284c7">
    <!-- 24 Gear Teeth placed circularly -->
    <circle cx="250" cy="230" r="200" fill="#0284c7" filter="url(#dropShadow)" />
    <!-- Gear teeth blocks around outer edge -->
    <g transform="translate(250, 230)">
      <!-- 24 teeth: 360/24 = 15 deg each -->
      <rect x="-14" y="-216" width="28" height="24" rx="3" fill="#0284c7" />
      <rect x="-14" y="-216" width="28" height="24" rx="3" fill="#0284c7" transform="rotate(15)" />
      <rect x="-14" y="-216" width="28" height="24" rx="3" fill="#0284c7" transform="rotate(30)" />
      <rect x="-14" y="-216" width="28" height="24" rx="3" fill="#0284c7" transform="rotate(45)" />
      <rect x="-14" y="-216" width="28" height="24" rx="3" fill="#0284c7" transform="rotate(60)" />
      <rect x="-14" y="-216" width="28" height="24" rx="3" fill="#0284c7" transform="rotate(75)" />
      <rect x="-14" y="-216" width="28" height="24" rx="3" fill="#0284c7" transform="rotate(90)" />
      <rect x="-14" y="-216" width="28" height="24" rx="3" fill="#0284c7" transform="rotate(105)" />
      <rect x="-14" y="-216" width="28" height="24" rx="3" fill="#0284c7" transform="rotate(120)" />
      <rect x="-14" y="-216" width="28" height="24" rx="3" fill="#0284c7" transform="rotate(135)" />
      <rect x="-14" y="-216" width="28" height="24" rx="3" fill="#0284c7" transform="rotate(150)" />
      <rect x="-14" y="-216" width="28" height="24" rx="3" fill="#0284c7" transform="rotate(165)" />
      <rect x="-14" y="-216" width="28" height="24" rx="3" fill="#0284c7" transform="rotate(180)" />
      <rect x="-14" y="-216" width="28" height="24" rx="3" fill="#0284c7" transform="rotate(195)" />
      <rect x="-14" y="-216" width="28" height="24" rx="3" fill="#0284c7" transform="rotate(210)" />
      <rect x="-14" y="-216" width="28" height="24" rx="3" fill="#0284c7" transform="rotate(225)" />
      <rect x="-14" y="-216" width="28" height="24" rx="3" fill="#0284c7" transform="rotate(240)" />
      <rect x="-14" y="-216" width="28" height="24" rx="3" fill="#0284c7" transform="rotate(255)" />
      <rect x="-14" y="-216" width="28" height="24" rx="3" fill="#0284c7" transform="rotate(270)" />
      <rect x="-14" y="-216" width="28" height="24" rx="3" fill="#0284c7" transform="rotate(285)" />
      <rect x="-14" y="-216" width="28" height="24" rx="3" fill="#0284c7" transform="rotate(300)" />
      <rect x="-14" y="-216" width="28" height="24" rx="3" fill="#0284c7" transform="rotate(315)" />
      <rect x="-14" y="-216" width="28" height="24" rx="3" fill="#0284c7" transform="rotate(330)" />
      <rect x="-14" y="-216" width="28" height="24" rx="3" fill="#0284c7" transform="rotate(345)" />
    </g>
  </g>

  <!-- Inner Gear Channel Ring -->
  <circle cx="250" cy="230" r="162" fill="url(#sunburstGrad)" stroke="#ffffff" stroke-width="4" />

  <!-- Sunburst Rays radiating from center -->
  <g stroke="#ffffff" stroke-width="1.8" opacity="0.45">
    <line x1="250" y1="230" x2="250" y2="70" />
    <line x1="250" y1="230" x2="330" y2="92" />
    <line x1="250" y1="230" x2="390" y2="150" />
    <line x1="250" y1="230" x2="410" y2="230" />
    <line x1="250" y1="230" x2="390" y2="310" />
    <line x1="250" y1="230" x2="330" y2="368" />
    <line x1="250" y1="230" x2="250" y2="390" />
    <line x1="250" y1="230" x2="170" y2="368" />
    <line x1="250" y1="230" x2="110" y2="310" />
    <line x1="250" y1="230" x2="90" y2="230" />
    <line x1="250" y1="230" x2="110" y2="150" />
    <line x1="250" y1="230" x2="170" y2="92" />
  </g>

  <!-- Outer Ring Text: UNIVERSITY INSTITUTE OF ENGINEERING AND TECHNOLOGY -->
  <text fill="#ffffff" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="16.5" letter-spacing="2.8">
    <textPath href="#upperTextArc" startOffset="50%" text-anchor="middle">
      • UNIVERSITY INSTITUTE OF ENGINEERING AND TECHNOLOGY •
    </textPath>
  </text>

  <!-- Central Golden Open Hand (Crafted UIET Symbol) -->
  <g id="goldenHand" filter="url(#dropShadow)" transform="translate(0, -10)">
    <!-- Palm & Hand Contour -->
    <path d="M 190,340 
             C 180,310 160,270 148,225 
             C 142,205 152,185 168,175 
             C 178,168 190,175 196,190 
             L 215,240 
             L 218,145 
             C 219,130 232,120 246,122 
             C 258,124 266,136 266,150 
             L 266,225 
             L 284,135 
             C 287,122 299,114 312,116 
             C 324,118 332,128 332,142 
             L 330,225 
             L 348,155 
             C 352,142 364,136 376,140 
             C 387,144 394,156 390,170 
             C 382,200 375,235 390,265 
             C 400,285 392,310 380,335 
             C 365,365 310,368 250,368 
             C 205,368 195,355 190,340 Z" 
          fill="url(#goldHandGrad)" 
          stroke="#ca8a04" 
          stroke-width="2.5" />

    <!-- Stylized UIET letters at finger tips -->
    <!-- Letter U on left finger -->
    <text x="217" y="170" fill="#a16207" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" text-anchor="middle">U</text>
    <!-- Letter I on middle finger -->
    <text x="256" y="165" fill="#a16207" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" text-anchor="middle">I</text>
    <!-- Letter E on ring finger -->
    <text x="296" y="165" fill="#a16207" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" text-anchor="middle">E</text>
    <!-- Letter T on index/pinky finger -->
    <text x="335" y="170" fill="#a16207" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" text-anchor="middle">T</text>

    <!-- Engineering lines / compass schematic markings across palm -->
    <path d="M 165,245 Q 260,220 380,240" fill="none" stroke="#9a3412" stroke-width="3" opacity="0.65" stroke-linecap="round" />
    <path d="M 235,235 L 245,340" fill="none" stroke="#9a3412" stroke-width="2.5" opacity="0.65" stroke-linecap="round" />
    <path d="M 210,260 Q 245,290 245,340" fill="none" stroke="#9a3412" stroke-width="2.5" opacity="0.65" stroke-linecap="round" />
    <circle cx="245" cy="265" r="14" fill="none" stroke="#9a3412" stroke-width="2.5" opacity="0.65" />
    <circle cx="245" cy="265" r="4" fill="#9a3412" opacity="0.75" />
  </g>

  <!-- Bottom Blue Ribbon Banner -->
  <g id="bottomRibbon">
    <!-- Ribbon Tails Left & Right -->
    <polygon points="45,415 110,380 110,430 45,445 65,430" fill="#0369a1" />
    <polygon points="455,415 390,380 390,430 455,445 435,430" fill="#0369a1" />

    <!-- Main Front Curved Ribbon Body -->
    <path d="M 85,410 
             Q 250,365 415,410 
             L 415,435 
             Q 250,395 85,435 Z" 
          fill="url(#ribbonGrad)" 
          stroke="#075985" 
          stroke-width="2" 
          filter="url(#dropShadow)" />

    <!-- Sanskrit Motto on Ribbon: विद्यया विनियोगात् विकासः -->
    <text fill="#ffffff" font-family="'Noto Sans Devanagari', 'Mangal', 'Arial Unicode MS', sans-serif" font-weight="700" font-size="19" letter-spacing="1">
      <textPath href="#sanskritArc" startOffset="50%" text-anchor="middle">
        विद्यया विनियोगात् विकासः
      </textPath>
    </text>

    <!-- UIET Title on Center Bottom -->
    <text x="250" y="442" fill="#0284c7" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="30" text-anchor="middle" letter-spacing="3" stroke="#ffffff" stroke-width="1.5">
      UIET
    </text>

    <!-- PANJAB UNIVERSITY CHANDIGARH Arched Underneath -->
    <text fill="#0f172a" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="14.5" letter-spacing="2">
      <textPath href="#punjabUniArc" startOffset="50%" text-anchor="middle">
        PANJAB UNIVERSITY CHANDIGARH
      </textPath>
    </text>
  </g>
</svg>
